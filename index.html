<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラム 音声読み上げサイト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>ドラム 音声読み上げサイト</h1>
      <p>テキストを入力して音声を再生できます</p>
    </header>

    <!-- 上部広告枠（2つ並べるための箱） -->
    <div class="ad-container">
      <div class="ad-box" id="top-ad-1"><a href="https://px.a8.net/svt/ejp?a8mat=4BEPPT+3K07UA+3EV2+ZRXQP" rel="nofollow">
<img border="0" width="300" height="250" alt="" src="https://www20.a8.net/svt/bgt?aid=261026993215&wid=001&eno=01&mid=s00000015923006009000&mc=1"></a>
<img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4BEPPT+3K07UA+3EV2+ZRXQP" alt=""></div>
      <div class="ad-box" id="top-ad-2"><a href="https://px.a8.net/svt/ejp?a8mat=4BEPPT+17GNXU+2D8M+NY1YA" rel="nofollow">映画、ドラマ、音楽などなど。お探しのタイトル、ここなら見つかるかも？「ゲオ宅配レンタル」</a>
<img border="0" width="1" height="1" src="https://www11.a8.net/0.gif?a8mat=4BEPPT+17GNXU+2D8M+NY1YA" alt=""></div>
    </div>

    <main class="card">
      <div class="form-group">
        <label for="textInput">読み上げる文章</label>
        <textarea id="textInput" placeholder="ここに日本語の文章を入力してください..."></textarea>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="speakText()">▶ 再生する</button>
        <button class="btn btn-drum" onclick="playDrumRoll()">🥁 ドラム</button>
        <button class="btn btn-secondary" onclick="stopSpeech()">⏹ 停止</button>
      </div>
    </main>

    <!-- 下部広告枠（2つ並べるための箱） -->
    <div class="ad-container">
      <div class="ad-box" id="bottom-ad-1"><a href="https://px.a8.net/svt/ejp?a8mat=4BEPPS+G6VE0I+1WP2+1HL85U" rel="nofollow">【PR】ウルトラ投資アプリ【TOSSY】</a>
<img border="0" width="1" height="1" src="https://www11.a8.net/0.gif?a8mat=4BEPPS+G6VE0I+1WP2+1HL85U" alt=""></div>
      <div class="ad-box" id="bottom-ad-2"><a href="https://px.a8.net/svt/ejp?a8mat=4BEPQ0+AMTQR6+3L4C+6DC6A" rel="nofollow">ＦＰ資格継続教育パック</a>
<img border="0" width="1" height="1" src="https://www14.a8.net/0.gif?a8mat=4BEPQ0+AMTQR6+3L4C+6DC6A" alt=""></div>
    </div>

    <section class="info-section">
      <h2>このツールについて</h2>
      <p>ブラウザ標準の音声合成エンジン（Web Speech API）を利用したテキスト読み上げツールです。</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
