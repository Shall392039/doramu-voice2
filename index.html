<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドラム 音声読み上げサイト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>ドラム 音声読み上げサイト</h1>
      <p>テキストを入力して音声を再生できます</p>
    </header>

    <!-- 上部広告枠 -->
    <div class="ad-container">
   <a href="https://rpx.a8.net/svt/ejp?a8mat=4BEPPS+G5OISY+2HOM+656YP&rakuten=y&a8ejpredirect=http%3A%2F%2Fhb.afl.rakuten.co.jp%2Fhgc%2F0ea62065.34400275.0ea62066.204f04c0%2Fa26102674853_4BEPPS_G5OISY_2HOM_656YP%3Fpc%3Dhttp%253A%252F%252Fwww.rakuten.co.jp%252F%26m%3Dhttp%253A%252F%252Fm.rakuten.co.jp%252F" rel="nofollow">
<img src="http://hbb.afl.rakuten.co.jp/hsb/0ec09ba3.bc2429d5.0eb4bbaa.95151395/" border="0"></a>
<img border="0" width="1" height="1" src="https://www17.a8.net/0.gif?a8mat=4BEPPS+G5OISY+2HOM+656YP" alt="">
    </div>

    <main class="card">
      <div class="form-group">
        <label for="textInput">読み上げる文章</label>
        <textarea id="textInput" placeholder="ここに日本語の文章を入力してください..."></textarea>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="speakText()">▶ 再生する</button>
        <button class="btn btn-drum" onclick="playDrumRoll()">🥁 ドラム</button>
        <button class="btn btn-secondary" onclick="stopSpeech()">⏹ 停止</button>
      </div>
    </main>

    <!-- 下部広告枠 -->
    <div class="ad-container">
      【スポンサーリンク / 広告スペース】
    </div>

    <section class="info-section">
      <h2>このツールについて</h2>
      <p>ブラウザ標準の音声合成エンジン（Web Speech API）を利用したテキスト読み上げツールです。</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
